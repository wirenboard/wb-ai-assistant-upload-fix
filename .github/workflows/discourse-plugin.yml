name: Discourse Plugin

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  ci:
    # Два ядра отвечают на два разных вопроса, и одного мало. Красный прогон на ядре, которого на
    # портале нет, означает лишь «сломается при обновлении»; зелёный на более новом ядре ничего не
    # говорит о том, что стоит сейчас.
    #
    #   release/2026.8 — линия, на которой портал стоит сегодня. Поднимать при обновлении.
    #   beta           — ТЕГ, который Discourse двигает с каждым релизом. Именно его выбирает
    #                    `version: beta` в app.yml портала, поэтому эта нога всегда проверяет то,
    #                    что принесёт следующая пересборка. Сама себя обновляет.
    #
    # Про имена: `beta` и `stable` — теги, а не ветки; `latest`, `main` и `tests-passed` — одна и та
    # же вершина разработки.
    name: ci (${{ matrix.core_ref }})
    strategy:
      fail-fast: false # падение на одном ядре не должно отменять прогон на другом
      matrix:
        core_ref:
          - release/2026.8 # стоит сейчас
          - beta # что принесёт следующая пересборка
    uses: discourse/.github/.github/workflows/discourse-plugin.yml@v1
    with:
      core_ref: ${{ matrix.core_ref }}
      # Плагин только на Ruby: нет package.json, .eslintrc, .prettierrc и своего .rubocop.yml,
      # поэтому линтерной работе нечего проверять и она упала бы на отсутствующих конфигах.
      skip_linting: true
